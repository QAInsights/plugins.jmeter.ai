name: PR Check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'src/data/plugins_data.json'
      - 'public/og/**'
      - 'README.md'
      - 'demos/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Lint & Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (no warnings allowed)
        run: npm run lint:ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and component tests
        run: npm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
